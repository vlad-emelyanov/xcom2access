; Earcons: SoundCues the companion plays through the game's own sound manager.
;
; The Community Highlander (Issue #10) gives XComSoundManager a SoundCue counterpart to the game's
; AkEvent table: every path listed under +SoundCuePaths is loaded at the manager's Init, keyed by
; the cue's OBJECT NAME, and PlaySoundEvent("<name>") plays it when no AkEvent carries that key.
; The cues live in Content/X2AccessSounds.upk, built by tools/make_sound_upk.py from Sounds/*.wav
; (docs/build.md, sounds) — one cue per WAV, named after the file's stem (the part before the
; first dot; the rest are build tags).
;
; Each sound manager reads its own section: register a cue under the manager of the layer that
; plays it (tactical here; an Avenger earcon would need the same line under
; [XComGame.XComStrategySoundManager]).

[XComGame.XComTacticalSoundManager]
; The tile cursor's line-of-sight crossing (X2AccessTileReader.CueSight).
+SoundCuePaths="X2AccessSounds.X2Access_LOS_Lost"
+SoundCuePaths="X2AccessSounds.X2Access_LOS_Gained"
; The wall tones' four looping voices (X2AccessWallTones). Registered so the manager preloads
; them; they are held in AudioComponents, never played through PlaySoundEvent, which could not
; stop a loop.
+SoundCuePaths="X2AccessSounds.X2Access_Wall_North"
+SoundCuePaths="X2AccessSounds.X2Access_Wall_South"
+SoundCuePaths="X2AccessSounds.X2Access_Wall_East"
+SoundCuePaths="X2AccessSounds.X2Access_Wall_West"
