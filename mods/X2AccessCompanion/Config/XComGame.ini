DLCIdentifier="X2AccessCompanion"

; The tile cursor's wall tones (X2AccessWallTones): four looping voices whose volumes rise as a
; wall nears in each compass direction from the cursor. No hotkey yet — these are the controls.
;   Mode          0 off, 1 when moving (rises on a landing, fades HoldSeconds later), 2 continuous
;   Volume        full-scale multiplier at the wall itself (0..1)
;   RangeTiles    a wall farther than this is silent
;   GlideSeconds  how long a volume change takes
;   HoldSeconds   when moving: how long the bed stays up after a landing
[X2AccessCompanion.X2AccessWallTones]
Mode=1
Volume=0.25
RangeTiles=4.0
GlideSeconds=0.5
HoldSeconds=1.0
