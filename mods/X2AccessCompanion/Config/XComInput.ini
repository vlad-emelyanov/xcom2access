; X2Access — soldier switching on Q and E, in both layers.
;
; Merged IN MEMORY over the player's live input config when the companion loads (measured
; 2026-09-16 off the CDO arrays: the player's own saved XComInput.ini is not rewritten, and every
; removal below took — docs/input-map.md §Soldier switching). The game's own Controls
; screen is a key-name-for-command swap over the same array: "NEXT UNIT / TARGET" is the
; Tab_Key_Press command and "PREVIOUS UNIT / TARGET" the Left_Shift_Key_Press command, and every
; handler in XComTacticalInput and every screen's OnUnrealCommand keys on the COMMAND, never on the
; physical key. So moving the two commands onto E and Q makes E and Q "Tab" and "LeftShift" in
; every meaning the game gives them: next/previous soldier in world mode, next/previous target
; while the shot HUD is raised, next/previous soldier in the Armory, Customize and Bond screens.
; The game's own key hints follow, because %NEXT_SOLDIER and friends resolve from the live binding.
;
; What the four vanilla lines did, and why a blind player loses nothing:
;   Q / E   — camera rotation, and nothing else in any tactical state. The tile cursor is
;             world-absolute (Up is always north), so yaw changes nothing spoken; a camera that
;             never turns also keeps stereo panning aligned with the compass.
;   Tab     — next unit / next target. Free for the mod's HUD layer once it is gone.
;   LeftShift — PREVIOUS unit, on RELEASE, unconditionally (XComTacticalInput.uc:2147). With the
;             binding gone the handler is unreachable, so Shift is an ordinary modifier again and
;             the arbiter no longer has to swallow it.
;
; The engine executes exactly ONE binding per key event (the last matching entry wins), so the
; additions alone would already shadow the camera lines; the removals keep the Controls screen
; from listing a key twice. ⛔ A removal matches the vanilla line TEXT EXACTLY, tabs included —
; do not reformat these.
;
; ⛔ The Controls screen's Save writes the live array into the player's own XComInput.ini, so once
; they save there these bindings are baked into their profile (CLAUDE.md, the Bindings rule).

[XComGame.XComTacticalInput]
-Bindings=(Name="Q", Command="Q_Key_Press | onrelease Q_Key_Release", bPrimaryBinding=True)
-Bindings=(Name="E", Command="E_Key_Press | onrelease E_Key_Release", bPrimaryBinding=True)
-Bindings=(Name="Tab",				Command="Tab_Key_Press | onrelease Tab_Key_Release", bPrimaryBinding=True)
-Bindings=(Name="LeftShift",		Command="Left_Shift_Key_Press | onrelease Left_Shift_Key_Release", Shift=False, bPrimaryBinding=True)
+Bindings=(Name="E", Command="Tab_Key_Press | onrelease Tab_Key_Release", bPrimaryBinding=True)
+Bindings=(Name="Q", Command="Left_Shift_Key_Press | onrelease Left_Shift_Key_Release", bPrimaryBinding=True)

; The strategy layer: the same two commands are "shortcuts to switch soldiers in the barracks"
; (DefaultInput.ini's own comment), delivered to the screen stack as FXS_KEY_TAB and
; FXS_KEY_LEFT_SHIFT. In a retail build the only screens that act on them are the Armory family,
; Customize, the Bond screen and Squad Select's slot focus; text entry is safe because the input
; dialogue and the save screen consume every command. Q and E carry no binding in this section.
; These two are not exposed on the Controls screen at all, so config is the only way to move them.
[XComGame.XComHeadquartersInput]
-Bindings=(Name="Tab",		Command="Tab_Key_Press | onrelease Tab_Key_Release", bPrimaryBinding=True)
-Bindings=(Name="LeftShift",	Command="Left_Shift_Key_Press | onrelease Left_Shift_Key_Release", Shift=False, bPrimaryBinding=True)
+Bindings=(Name="E", Command="Tab_Key_Press | onrelease Tab_Key_Release", bPrimaryBinding=True)
+Bindings=(Name="Q", Command="Left_Shift_Key_Press | onrelease Left_Shift_Key_Release", bPrimaryBinding=True)
